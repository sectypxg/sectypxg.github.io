
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sectg Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #313338;
      color: #f2f3f5;
    }
    header {
      padding: 18px;
      background: #232428;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #45464d;
    }
    #status {
      padding: 8px 16px;
      color: #b5bac1;
      font-size: 13px;
    }
    #messages {
      height: calc(100dvh - 190px);
      min-height: 250px;
      overflow-y: auto;
      padding: 16px;
    }
    .message {
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }
    .nickname {
      font-weight: bold;
      color: #b9a4ff;
      margin-right: 8px;
    }
    .time {
      color: #949ba4;
      font-size: 11px;
    }
    .text {
      margin-top: 5px;
      white-space: pre-wrap;
    }
    #login, #composer {
      padding: 12px;
      background: #232428;
      display: flex;
      gap: 8px;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #45464d;
      border-radius: 6px;
      background: #383a40;
      color: white;
      font-size: 15px;
    }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #login { display: none; }
    #composer { display: none; }
  </style>
</head>
<body>
  <header>💬 Sectg Chat</header>
  <div id="status">Firebaseに接続中...</div>
  <div id="messages"></div>

  <div id="login">
    <input id="nickname" maxlength="20"
      placeholder="ニックネーム（20文字以内）">
    <button id="join">参加</button>
  </div>

  <div id="composer">
    <input id="messageInput" maxlength="300"
      placeholder="メッセージを入力..." autocomplete="off">
    <button id="send">送信</button>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth, signInAnonymously
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase, ref, push, onValue, query,
      orderByChild, limitToLast, serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // FirebaseのConfigの値に置き換えてね
    const firebaseConfig = {
      apiKey: "AIzaSyAr0BZOVQkF9bC7k6tTnTIAHKiJfkUMQK4",
      authDomain: "sectg-caht.firebaseapp.com",
      databaseURL: "https://sectg-caht-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sectg-caht-web",
      appId: "1:1014367962448:web:86e2b8046e2107c03d5855"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const status = document.getElementById("status");
    const messages = document.getElementById("messages");
    const login = document.getElementById("login");
    const nicknameInput = document.getElementById("nickname");
    const composer = document.getElementById("composer");
    const messageInput = document.getElementById("messageInput");
    const joinButton = document.getElementById("join");
    const sendButton = document.getElementById("send");

    let nickname = "";

    function showMessages(snapshot) {
      messages.replaceChildren();

      snapshot.forEach(child => {
        const item = child.val();
        if (!item) return;

        const row = document.createElement("div");
        row.className = "message";

        const name = document.createElement("span");
        name.className = "nickname";
        name.textContent = item.nickname || "名無し";

        const time = document.createElement("span");
        time.className = "time";
        time.textContent = item.createdAt
          ? new Date(item.createdAt).toLocaleTimeString("ja-JP", {
              hour: "2-digit", minute: "2-digit"
            })
          : "";

        const content = document.createElement("div");
        content.className = "text";
        content.textContent = item.text || "";

        row.append(name, time, content);
        messages.appendChild(row);
      });

      messages.scrollTop = messages.scrollHeight;
    }

    async function start() {
      try {
        status.textContent = "認証中...";
        await signInAnonymously(auth);

        status.textContent = "ニックネームを入力して参加してね";
        login.style.display = "flex";
      } catch (error) {
        console.error(error);
        status.textContent =
          "接続できません。Firebaseの設定とデータベースのルールを確認してね。";
      }
    }

    joinButton.addEventListener("click", () => {
      const value = nicknameInput.value.trim();

      if (!value || value.length > 20) {
        alert("ニックネームを1〜20文字で入力してね");
        return;
      }

      nickname = value;
      login.style.display = "none";
      composer.style.display = "flex";
      status.textContent = "参加中：" + nickname;

      const recentMessages = query(
        ref(db, "messages"),
        orderByChild("createdAt"),
        limitToLast(100)
      );

      onValue(recentMessages, showMessages, error => {
        console.error(error);
        status.textContent = "メッセージを読み込めませんでした";
      });
    });

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !nickname || sendButton.disabled) return;

      sendButton.disabled = true;

      try {
        await push(ref(db, "messages"), {
          nickname,
          text,
          createdAt: serverTimestamp()
        });
        messageInput.value = "";
      } catch (error) {
        console.error(error);
        alert("送信できませんでした。データベースのルールを確認してね。");
      } finally {
        sendButton.disabled = false;
      }
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter") sendMessage();
    });

    start();
  </script>
</body>
</html>
